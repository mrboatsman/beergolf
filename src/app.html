<!doctype html>
<html lang="sv">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#17382b" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Beer Golf" />
		<script>
			// Fånga PWA-installprompten innan appen hydrerat (eventet kommer tidigt).
			window.addEventListener('beforeinstallprompt', function (e) {
				e.preventDefault();
				window.__bgInstallPrompt = e;
				window.dispatchEvent(new Event('bg:installprompt'));
			});
			window.addEventListener('appinstalled', function () {
				window.__bgInstallPrompt = null;
				window.dispatchEvent(new Event('bg:installed'));
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
