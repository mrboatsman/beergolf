		<script>
			document.addEventListener('DOMContentLoaded', async function () {
				const loading = document.getElementById('__bundler_loading');
				function setStatus(msg) {
					if (loading) loading.textContent = msg;
				}

				const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
				const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
				function toBase64(bytes) {
					let bin = '';
					for (let i = 0; i < bytes.length; i += 0x8000) {
						bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
					}
					return btoa(bin);
				}

				// Error sink persists across replaceWith since it's on window, not the DOM.
				window.addEventListener(
					'error',
					function (e) {
						var p = document.body || document.documentElement;
						var d =
							document.getElementById('__bundler_err') ||
							p.appendChild(document.createElement('div'));
						d.id = '__bundler_err';
						d.style.cssText =
							'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
						d.textContent =
							(d.textContent ? d.textContent + String.fromCharCode(10) : '') +
							'[bundle] ' +
							(e.message || e.type) +
							(e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
					},
					true
				);

				try {
					const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
					const templateEl = document.querySelector('script[type="__bundler/template"]');
					if (!manifestEl || !templateEl) {
						setStatus('Error: missing bundle data');
						console.error(
							'[bundler] Missing script tags — manifestEl:',
							!!manifestEl,
							'templateEl:',
							!!templateEl
						);
						return;
					}

					const manifest = JSON.parse(manifestEl.textContent);
					let template = JSON.parse(templateEl.textContent);

					const uuids = Object.keys(manifest);
					setStatus('Unpacking ' + uuids.length + ' assets...');

					const blobUrls = {};
					await Promise.all(
						uuids.map(async (uuid) => {
							const entry = manifest[uuid];
							try {
								const binaryStr = atob(entry.data);
								const bytes = new Uint8Array(binaryStr.length);
								for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

								let finalBytes = bytes;
								if (entry.compressed) {
									if (typeof DecompressionStream !== 'undefined') {
										const ds = new DecompressionStream('gzip');
										const writer = ds.writable.getWriter();
										const reader = ds.readable.getReader();
										writer.write(bytes);
										writer.close();
										const chunks = [];
										let totalLen = 0;
										while (true) {
											const { done, value } = await reader.read();
											if (done) break;
											chunks.push(value);
											totalLen += value.length;
										}
										finalBytes = new Uint8Array(totalLen);
										let offset = 0;
										for (const chunk of chunks) {
											finalBytes.set(chunk, offset);
											offset += chunk.length;
										}
									} else {
										console.warn(
											'DecompressionStream not available, asset ' + uuid + ' may not render'
										);
									}
								}

								if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
									// Strict artifact hosts allow font-src data: but not blob:.
									blobUrls[uuid] =
										'data:' +
										entry.mime +
										';base64,' +
										(entry.compressed ? toBase64(finalBytes) : entry.data);
								} else {
									blobUrls[uuid] = URL.createObjectURL(
										new Blob([finalBytes], { type: entry.mime })
									);
								}
							} catch (err) {
								console.error('Failed to decode asset ' + uuid + ':', err);
								blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
							}
						})
					);

					const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
					const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
					const resourceMap = {};
					for (const entry of extResources) {
						if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
					}

					setStatus('Rendering...');
					for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

					// Strip integrity + crossorigin — blob URLs from a file:// document inherit
					// a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
					// The manifest bytes are ours; SRI protects against CDN compromise, not this.
					template = template
						.replace(/\s+integrity="[^"]*"/gi, '')
						.replace(/\s+crossorigin="[^"]*"/gi, '');

					const resourceScript =
						'<script>window.__resources = ' +
						JSON.stringify(resourceMap)
							.split('</' + 'script>')
							.join('<\\/' + 'script>') +
						';</' +
						'script>';
					// Inject after <head> so the DOCTYPE stays first; prepending the script
					// would push the parser into quirks mode. DOMParser always emits a <head>
					// (synthesizing one if the source HTML omitted it) but may carry
					// attributes through, so match the full opening tag. slice() rather than
					// replace() keeps us clear of $-pattern substitution in resourceScript.
					const headOpen = template.match(/<head[^>]*>/i);
					if (headOpen) {
						const i = headOpen.index + headOpen[0].length;
						template = template.slice(0, i) + resourceScript + template.slice(i);
					}

					// Parse the template and swap the root element. Scripts inserted via
					// DOMParser/replaceWith are inert per spec — re-create each with
					// createElement so they execute, awaiting onload for src scripts to
					// preserve ordering (React before ReactDOM before Babel before text/babel).
					const doc = new DOMParser().parseFromString(template, 'text/html');
					document.documentElement.replaceWith(doc.documentElement);
					const dead = Array.from(document.scripts);
					for (const old of dead) {
						const s = document.createElement('script');
						for (const a of old.attributes) s.setAttribute(a.name, a.value);
						s.textContent = old.textContent;
						// text/babel scripts with a src: fetch and inline. transformScriptTags
						// does XHR against the src, but blob:null/ from a file:// origin is
						// silently dropped. Inlining makes it a plain inline babel script,
						// which transformScriptTags handles unconditionally.
						if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
							const r = await fetch(s.src);
							s.textContent = await r.text();
							s.removeAttribute('src');
						}
						const p = s.src
							? new Promise(function (r) {
									s.onload = s.onerror = r;
								})
							: null;
						old.replaceWith(s);
						if (p) await p;
					}
					// Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
					// which fired before we swapped the document. Trigger manually if present.
					if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
						window.Babel.transformScriptTags();
					}
				} catch (err) {
					setStatus('Error unpacking: ' + err.message);
					console.error('Bundle unpack error:', err);
				}
			});
		</script>

{ rsPoints }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;\">\n        <!-- front/back -->\n        <div style=\"background:#fdfbf4;border:1px solid rgba(15,61,46,0.12);border-radius:14px;padding:22px 24px;\">\n          <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22px;color:#0f3d2e;margin-bottom:16px;\">Nine-by-Nine<\u002Fh2>\n          <sc-for list=\"{{ splits }}\" as=\"sp\" hint-placeholder-count=\"2\">\n          <div style=\"margin-bottom:16px;\">\n            <div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;\">\n              <span style=\"font-weight:600;color:#26241f;\">{{ sp.label }}<\u002Fspan>\n              <span style=\"color:#6f6a5c;font-variant-numeric:tabular-nums;\">{{ sp.gross }} <span style=\"color:#a39d8c;\">({{ sp.diff }})<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:10px;border-radius:999px;background:rgba(15,61,46,0.09);overflow:hidden;\">\n              <div style=\"height:100%;width:{{ sp.pct }};background:linear-gradient(90deg,#0f3d2e,#c9a24b);border-radius:999px;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- scoring breakdown -->\n        <div style=\"background:#fdfbf4;border:1px solid rgba(15,61,46,0.12);border-radius:14px;padding:22px 24px;\">\n          <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22px;color:#0f3d2e;margin-bottom:16px;\">Scoring Breakdown<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center;\">\n            <sc-for list=\"{{ breakdown }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <div style=\"padding:12px 6px;border-radius:10px;background:rgba(15,61,46,0.04);\">\n              <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;color:#0f3d2e;\">{{ b.count }}<\u002Fdiv>\n              <div style=\"font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:#8a8574;margin-top:2px;\">{{ b.label }}<\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:18px;padding-top:16px;border-top:1px solid rgba(15,61,46,0.1);font-size:13px;color:#6f6a5c;line-height:1.5;\">\n            Round of the season — net <b style=\"color:#0f3d2e;\">{{ totals.net }}<\u002Fb> is level with your playing handicap. Best hole: <b style=\"color:#0f3d2e;\">the 8th<\u002Fb>, a birdie on the par 3.\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ---------- LEADERBOARD ---------- -->\n    <sc-if value=\"{{ isLeaderboard }}\">\n    <div style=\"max-width:860px;animation:fadeUp 0.4s ease both;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:22px;\">\n        <div>\n          <div style=\"font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#c9a24b;font-weight:700;margin-bottom:6px;\">Club Competition<\u002Fdiv>\n          <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:40px;color:#0f3d2e;line-height:1;\">Autumn Medal · Round 2<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;color:#6f6a5c;\">Ranked by {{ lbBasis }} · Field of 8 · Complete<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fdfbf4;border:1px solid rgba(15,61,46,0.14);border-radius:14px;overflow:hidden;\">\n        <div style=\"display:grid;grid-template-columns:56px 1fr 80px 80px 80px;padding:12px 22px;border-bottom:2px solid rgba(15,61,46,0.2);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#8a8574;font-weight:700;\">\n          <div>Pos<\u002Fdiv><div>Player<\u002Fdiv><div style=\"text-align:center;\">HCP<\u002Fdiv><div style=\"text-align:center;\">Gross<\u002Fdiv><div style=\"text-align:center;\">Net<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ lbRows }}\" as=\"row\" hint-placeholder-count=\"8\">\n        <div style=\"display:grid;grid-template-columns:56px 1fr 80px 80px 80px;align-items:center;padding:13px 22px;border-bottom:1px solid rgba(15,61,46,0.07);background:{{ row.rowBg }};\">\n          <div style=\"{{ row.posStyle }}\">{{ row.pos }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;\">\n            <div style=\"{{ row.avatarStyle }}\">{{ row.initials }}<\u002Fdiv>\n            <span style=\"font-weight:600;color:#26241f;\">{{ row.name }}<\u002Fspan>\n            <span style=\"{{ row.youStyle }}\">{{ row.youLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"text-align:center;color:#8a8574;font-variant-numeric:tabular-nums;\">{{ row.hcp }}<\u002Fdiv>\n          <div style=\"text-align:center;color:#6f6a5c;font-variant-numeric:tabular-nums;\">{{ row.gross }}<\u002Fdiv>\n          <div style=\"text-align:center;font-weight:700;color:#0f3d2e;font-variant-numeric:tabular-nums;\">{{ row.net }}<\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ---------- PROFILE ---------- -->\n    <sc-if value=\"{{ isProfile }}\">\n    <div style=\"max-width:860px;animation:fadeUp 0.4s ease both;\">\n      <div style=\"background:#0f3d2e;background-image:linear-gradient(150deg,#124633,#0a2c20);border-radius:16px;padding:34px 36px;color:#f4efe1;display:flex;align-items:center;gap:26px;flex-wrap:wrap;box-shadow:0 12px 32px rgba(15,40,25,0.18);\">\n        <div style=\"width:92px;height:92px;border-radius:50%;border:2px solid #c9a24b;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,rgba(201,162,75,0.2),transparent);flex:0 0 92px;\">\n          <span style=\"font-family:'Cormorant Garamond',serif;font-weight:700;font-size:38px;color:#c9a24b;\">JE<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:200px;\">\n          <div style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#c9a24b;font-weight:700;\">Full Member<\u002Fdiv>\n          <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:40px;line-height:1.05;margin:4px 0 6px;\">{{ playerName }}<\u002Fh1>\n          <div style=\"font-size:13px;color:rgba(244,239,225,0.7);\">Member since 2009 · Ravensmoor Golf Club<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:right;\">\n          <div style=\"font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#c9a24b;font-weight:700;\">Handicap Index<\u002Fdiv>\n          <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:60px;line-height:0.9;\">{{ hcp }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px;\">\n        <sc-for list=\"{{ profileStats }}\" as=\"p\" hint-placeholder-count=\"4\">\n        <div style=\"background:#fdfbf4;border:1px solid rgba(15,61,46,0.12);border-radius:14px;padding:18px 20px;\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:32px;color:#0f3d2e;\">{{ p.value }}<\u002Fdiv>\n          <div style=\"font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:#8a8574;margin-top:3px;\">{{ p.label }}<\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"background:#fdfbf4;border:1px solid rgba(15,61,46,0.12);border-radius:14px;padding:24px 26px;margin-top:20px;\">\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px;color:#0f3d2e;margin-bottom:16px;\">Competition Record<\u002Fh2>\n        <sc-for list=\"{{ record }}\" as=\"e\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid rgba(15,61,46,0.08);\">\n          <div>\n            <div style=\"font-weight:600;font-size:14px;color:#26241f;\">{{ e.event }}<\u002Fdiv>\n            <div style=\"font-size:12px;color:#8a8574;margin-top:2px;\">{{ e.date }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;\">\n            <span style=\"font-size:13px;color:#6f6a5c;font-variant-numeric:tabular-nums;\">Net {{ e.net }}<\u002Fspan>\n            <span style=\"{{ e.finishStyle }}\">{{ e.finish }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1280, &quot;height&quot;: 880 },\n  &quot;accent&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#c9a24b&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#c9a24b&quot;, &quot;#b0862f&quot;, &quot;#7c2d2d&quot;, &quot;#2f6f4e&quot;], &quot;section&quot;: &quot;Appearance&quot; },\n  &quot;primaryScore&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;net&quot;, &quot;options&quot;: [&quot;net&quot;, &quot;gross&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Scoring&quot; },\n  &quot;showHoleMarks&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Scoring&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { screen: 'dashboard' };\n\n  hcpData = [12.8, 12.6, 12.5, 12.9, 12.3, 12.0, 11.9, 12.1, 11.8, 11.6, 11.5, 11.4];\n\n  frontPar = [4, 5, 4, 3, 4, 4, 5, 3, 4];\n  frontSI  = [7, 3, 11, 17, 1, 13, 5, 15, 9];\n  frontSc  = [5, 6, 3, 3, 5, 4, 6, 2, 5];\n  backPar  = [4, 4, 3, 5, 4, 4, 3, 5, 4];\n  backSI   = [8, 4, 18, 2, 10, 14, 16, 6, 12];\n  backSc   = [5, 4, 4, 7, 5, 4, 3, 7, 5];\n\n  playHcpNum = 13;\n\n  markStyle(diff, marks) {\n    const base = { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: '30px', height: '30px', fontVariantNumeric: 'tabular-nums', fontWeight: 600, fontSize: '15px', margin: '0 auto' };\n    if (!marks) {\n      const c = diff < 0 ? '#8f2d2d' : diff > 1 ? '#26241f' : '#26241f';\n      return { ...base, color: c };\n    }\n    if (diff <= -2) return { ...base, color: '#8f2d2d', borderRadius: '50%', boxShadow: 'inset 0 0 0 2px #8f2d2d, 0 0 0 2px #8f2d2d' };\n    if (diff === -1) return { ...base, color: '#8f2d2d', borderRadius: '50%', boxShadow: 'inset 0 0 0 2px #8f2d2d' };\n    if (diff === 0) return { ...base, color: '#26241f' };\n    if (diff === 1) return { ...base, color: '#26241f', borderRadius: '3px', boxShadow: 'inset 0 0 0 2px #26241f' };\n    return { ...base, color: '#26241f', borderRadius: '3px', boxShadow: 'inset 0 0 0 2px #26241f, 0 0 0 2px #26241f' };\n  }\n\n  diffStyle(diff) {\n    const c = diff < 0 ? '#8f2d2d' : diff === 0 ? '#0f3d2e' : '#6f6a5c';\n    return { color: c, fontWeight: 600, fontSize: '13px' };\n  }\n\n  buildHoles(offset, pars, sis, scs, marks) {\n    let strokes = this.playHcpNum;\n    return scs.map((score, i) => {\n      const par = pars[i], si = sis[i];\n      const rec = (si <= (strokes % 18 || 18) ? (si <= (strokes - 18) ? 2 : 1) : 0);\n      const recFinal = strokes >= 18 ? (si <= (strokes - 18) ? 2 : 1) : (si <= strokes ? 1 : 0);\n      const net = score - recFinal;\n      const diff = score - par;\n      return {\n        no: offset + i + 1, par, si, score, net,\n        diff,\n        diffText: diff > 0 ? '+' + diff : diff < 0 ? '' + diff : 'E',\n        diffStyle: this.diffStyle(diff),\n        markStyle: this.markStyle(diff, marks),\n        netDiff: net - par\n      };\n    });\n  }\n\n  buildChart(accent) {\n    const data = this.hcpData, n = data.length;\n    const W = 760, H = 240, padL = 42, padR = 18, padT = 18, padB = 30;\n    const min = Math.min(...data) - 0.4, max = Math.max(...data) + 0.4;\n    const X = i => padL + (i / (n - 1)) * (W - padL - padR);\n    const Y = v => padT + (1 - (v - min) / (max - min)) * (H - padT - padB);\n    const h = React.createElement;\n    const pts = data.map((v, i) => [X(i), Y(v)]);\n    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');\n    const area = line + ' L' + X(n - 1).toFixed(1) + ' ' + (H - padB) + ' L' + padL + ' ' + (H - padB) + ' Z';\n    const els = [];\n    const ticks = 4;\n    for (let t = 0; t <= ticks; t++) {\n      const val = min + (t / ticks) * (max - min), yy = Y(val);\n      els.push(h('line', { key: 'g' + t, x1: padL, x2: W - padR, y1: yy, y2: yy, stroke: 'rgba(15,61,46,0.09)', strokeWidth: 1 }));\n      els.push(h('text', { key: 'gt' + t, x: padL - 8, y: yy + 3.5, textAnchor: 'end', fontSize: 10, fill: '#a39d8c', fontFamily: 'Public Sans' }, val.toFixed(1)));\n    }\n    els.push(h('path', { key: 'area', d: area, fill: 'rgba(15,61,46,0.06)' }));\n    els.push(h('path', { key: 'line', d: line, fill: 'none', stroke: accent, strokeWidth: 2.5, strokeLinejoin: 'round', strokeLinecap: 'round' }));\n    pts.forEach((p, i) => {\n      els.push(h('circle', { key: 'd' + i, cx: p[0], cy: p[1], r: i === n - 1 ? 5 : 3, fill: i === n - 1 ? accent : '#0f3d2e', stroke: '#fdfbf4', strokeWidth: 1.5 }));\n    });\n    data.forEach((v, i) => {\n      if (i % 2 === 0 || i === n - 1) els.push(h('text', { key: 'x' + i, x: X(i), y: H - padB + 18, textAnchor: 'middle', fontSize: 10, fill: '#a39d8c', fontFamily: 'Public Sans' }, 'R' + (i + 1)));\n    });\n    return h('svg', { viewBox: '0 0 ' + W + ' ' + H, style: { width: '100%', height: 'auto', display: 'block' } }, els);\n  }\n\n  navStyle(active) {\n    return {\n      display: 'flex', alignItems: 'center', gap: '12px', width: '100%', textAlign: 'left',\n      padding: '11px 14px', border: 'none', borderRadius: '9px', cursor: 'pointer',\n      fontFamily: 'Public Sans', fontSize: '14px', fontWeight: active ? 600 : 500,\n      color: active ? '#f4efe1' : 'rgba(244,239,225,0.72)',\n      background: active ? 'rgba(201,162,75,0.14)' : 'transparent',\n      boxShadow: active ? 'inset 3px 0 0 #c9a24b' : 'none', transition: 'all 0.15s ease'\n    };\n  }\n\n  renderVals() {\n    const screen = this.state.screen;\n    const accent = this.props.accent ?? '#c9a24b';\n    const primary = this.props.primaryScore ?? 'net';\n    const marks = this.props.showHoleMarks ?? true;\n    const go = id => () => this.setState({ screen: id });\n\n    const nav = [['dashboard', 'Dashboard'], ['scorecard', 'Enter Scorecard'], ['round', 'Round Summary'], ['leaderboard', 'Leaderboard'], ['profile', 'Profile']];\n    const navItems = nav.map(([id, label]) => ({\n      id, label, onClick: go(id),\n      style: this.navStyle(id === screen),\n      dotStyle: { width: '6px', height: '6px', borderRadius: '50%', background: id === screen ? accent : 'rgba(244,239,225,0.3)', flex: '0 0 6px' }\n    }));\n\n    // scorecard\n    const front = this.buildHoles(0, this.frontPar, this.frontSI, this.frontSc, marks);\n    const back = this.buildHoles(9, this.backPar, this.backSI, this.backSc, marks);\n    const sum = a => a.reduce((x, y) => x + y, 0);\n    const outGross = sum(this.frontSc), inGross = sum(this.backSc);\n    const outPar = sum(this.frontPar), inPar = sum(this.backPar);\n    const outNet = sum(front.map(h => h.net)), inNet = sum(back.map(h => h.net));\n    const gross = outGross + inGross, par = outPar + inPar, net = outNet + inNet;\n    const signed = d => d > 0 ? '+' + d : d < 0 ? '' + d : 'E';\n    const totals = {\n      outGross, inGross, outPar, inPar, outNet, inNet, gross, par, net,\n      outDiff: signed(outGross - outPar), inDiff: signed(inGross - inPar), diff: signed(gross - par)\n    };\n\n    // stableford\n    const allHoles = front.concat(back);\n    const points = sum(allHoles.map(h => Math.max(0, 2 - h.netDiff))); 'Bogeys', count: cBogey }, { label: 'Double+', count: cDouble }\n    ];\n\n    // leaderboard\n    const basePlayers = [\n      { name: 'Margaret Cole', hcp: 8.2, gross: 80, net: 72 },\n      { name: 'Arthur Reid', hcp: 6.1, gross: 79, net: 73 },\n      { name: 'James Ellsworth', hcp: 11.4, gross, net, you: true },\n      { name: 'Henry Vance', hcp: 14.6, gross: 88, net: 73 },\n      { name: 'Eleanor Shaw', hcp: 18.9, gross: 93, net: 74 },\n      { name: 'Thomas Blake', hcp: 12.7, gross: 87, net: 74 },\n      { name: 'Fiona Grant', hcp: 10.3, gross: 84, net: 75 },\n      { name: 'William Doyle', hcp: 20.2, gross: 96, net: 77 }\n    ];\n    const key = primary === 'gross' ? 'gross' : 'net';\n    const sorted = [...basePlayers].sort((a, b) => a[key] - b[key]);\n    const lbRows = sorted.map((p, i) => {\n      const pos = i + 1, leader = pos === 1;\n      const initials = p.name.split(' ').map(w => w[0]).join('');\n      return {\n        pos, name: p.name, hcp: p.hcp, gross: p.gross, net: p.net, initials,\n        rowBg: p.you ? 'rgba(201,162,75,0.09)' : 'transparent',\n        posStyle: leader\n          ? { width: '28px', height: '28px', borderRadius: '50%', background: accent, color: '#0f3d2e', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: '14px' }\n          : { color: '#8a8574', fontWeight: 700, fontVariantNumeric: 'tabular-nums', paddingLeft: '6px' },\n        avatarStyle: { width: '30px', height: '30px', borderRadius: '50%', background: p.you ? '#0f3d2e' : 'rgba(15,61,46,0.1)', color: p.you ? '#f4efe1' : '#0f3d2e', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '11px', fontWeight: 700, flex: '0 0 30px' },\n        youLabel: p.you ? 'You' : '',\n        youStyle: p.you ? { fontSize: '10px', fontWeight: 700, letterSpacing: '0.06em', textTransform: 'uppercase', color: '#9c7b28', background: 'rgba(201,162,75,0.18)', padding: '2px 8px', borderRadius: '999px' } : { display: 'none' }\n      };\n    });\n    const lbBasis = primary === 'gross' ? 'gross score' : 'net score';\n\n    // profile\n    const profileStats = [\n      { label: 'Lowest HCP', value: '9.8' }, { label: 'Rounds logged', value: 142 },\n      { label: 'Competition wins', value: 3 }, { label: 'Avg. gross', value: 86 }\n    ];\n    const record = [\n      { event: 'Autumn Medal · Round 2', date: '9 Jul 2026', net: 70, finish: '1st', place: 1 },\n      { event: 'Captain\\u2019s Cup', date: '15 Jun 2026', net: 71, finish: '1st', place: 1 },\n      { event: 'Midsummer Stableford', date: '2 Jun 2026', net: 73, finish: 'T5', place: 5 },\n      { event: 'Spring Foursomes', date: '18 May 2026', net: 70, finish: '1st', place: 1 }\n    ].map(e => ({\n      ...e,\n      finishStyle: {\n        display: 'inline-block', minWidth: '40px', textAlign: 'center', padding: '4px 10px', borderRadius: '999px',\n        fontSize: '12px', fontWeight: 700,\n        background: e.place === 1 ? 'rgba(201,162,75,0.18)' : 'rgba(15,61,46,0.07)',\n        color: e.place === 1 ? '#9c7b28' : '#0f3d2e'\n      }\n    }));\n\n    return {\n      isDashboard: screen === 'dashboard', isScorecard: screen === 'scorecard',\n      isRound: screen === 'round', isLeaderboard: screen === 'leaderboard', isProfile: screen === 'profile',\n      navItems,\n      playerName: 'James Ellsworth', playerFirst: 'James', hcp: '11.4', playHcp: this.playHcpNum, seasonTrend: '1.4',\n      hcpChart: this.buildChart(accent),\n      stats, rounds,\n      courseMeta: [\n        { label: 'Tees', value: 'White' }, { label: 'Par', value: par },\n        { label: 'C.R.', value: '71.2' }, { label: 'Slope', value: '129' }, { label: 'Playing HCP', value: this.playHcpNum }\n      ],\n      frontHoles: front, backHoles: back, totals,\n      rsPrimaryLabel, rsPrimaryValue, rsSecondaryLabel, rsSecondaryValue,\n      rsToPar: totals.diff, rsPoints: points, splits, breakdown,\n      lbRows, lbBasis, profileStats, record\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fb
